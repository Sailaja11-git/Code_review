name: AI Code Review Report

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install -r requirements.txt  # install your review tool if needed

    - name: Run AI Code Review
      run: |
        python Code.py --path ./Code.py --output review_report.md

    - name: Commit and Push Review Report
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add review_report.md || echo "No changes to commit"
        git commit -m "Add AI code review report" || echo "Nothing to commit"
        git push || echo "No changes to push"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Review Report Artifact (Optional)
      uses: actions/upload-artifact@v4
      with:
        name: ai-review-report
        path: review_report.md
