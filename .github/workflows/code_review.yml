name: Code Review GPT

on:
  pull_request:
    branches:
      - main  # Change to your default branch if different

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install CodeReviewGPT
        run: |
          pip install codereviewgpt-cli  # Replace if you're using a custom script

      - name: Run CodeReviewGPT
        run: |
          codereviewgpt-cli --path ./ --output review_report.md

      - name: Comment on PR with Review Report
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: review_report.md
